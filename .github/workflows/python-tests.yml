name: Python Code Quality & Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pylint flake8
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test imports
      run: |
        python -c "import streamlit; import pandas; import numpy; import plotly; print('✓ All imports successful')"
    
    - name: Validate Python syntax
      run: |
        python -m py_compile main.py prediction_helper.py
        echo "✓ Python syntax validation passed"

  deploy-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Verify deployment files
      run: |
        test -f "main.py" && echo "✓ main.py exists"
        test -f "prediction_helper.py" && echo "✓ prediction_helper.py exists"
        test -f "requirements.txt" && echo "✓ requirements.txt exists"
        test -f ".streamlit/config.toml" && echo "✓ .streamlit/config.toml exists"
        test -f "README.md" && echo "✓ README.md exists"
        echo "✓ All deployment files present"
